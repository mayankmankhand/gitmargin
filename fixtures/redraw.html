<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme checkout</title>

<!--
  A checkout that draws every step into the same area (issue #34), the way a
  React prototype or a render() that replaces innerHTML does: only the step
  being shown is in the page, and each step's Back and Continue sit at the same
  address as the last step's. The logo and the help line stay put on every step.

  window.redrawShape({ ... }) redraws it in one of the habits prototypes are
  built with, back on step 1. Each switch is one habit, so a test can break one
  rule at a time:
    nodes   'replace'  every step is new markup (innerHTML)            (default)
            'keep'     the same nodes with new words (React's habit)
    title   'direct'   the step's h2 sits straight in the card         (default)
            'wrapped'  h2 and its lead line in their own box (the Tailwind habit)
            'page'     the title block drawn at the top of the page, apart from the card
    footer  'card'     Back and Continue inside the card               (default)
            'app'      one Back and Continue shared by every step, outside the card
    tag     true       the card carries data-gm-screen with the step's title
    dialog  'last'     the last step's card is itself a role="dialog" box, at the same address

  It never sets the URL hash and keeps no state, so a reload is always the
  default shape on step 1. Deliberately NOT stamped: `attach` runs on it.
-->

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: #1d1d1f; background: #f5f5f7; }
  .app { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
  .logo { font-weight: 700; font-size: 18px; margin-bottom: 20px; }
  .titlebar { max-width: 560px; margin: 0 auto; padding: 24px 24px 0; }
  .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0, 0, 0, .06); }
  h2 { margin: 0 0 6px; font-size: 21px; }
  .lead { color: #6e6e73; margin: 0 0 16px; }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid #d2d2d7; border-radius: 8px; font: inherit; }
  .actions { display: flex; justify-content: space-between; margin-top: 24px; }
  button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 0; background: #e8e8ed; cursor: pointer; }
  button.next { background: #0071e3; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .help { color: #6e6e73; font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>

<div class="app">
  <div class="logo">Acme</div>
  <div id="stage"></div>
  <div id="shared"></div>
  <p class="help">Questions? Call 0800 123 456.</p>
</div>

<script>
  var STEPS = [
    { title: 'Choose a plan', lead: 'Team is $29 a month, billed monthly.',
      body: '<label><input type="radio" name="plan" checked style="width:auto"> Team</label>' },
    { title: 'Your details', lead: 'We only use your email for receipts.',
      body: '<label for="email">Work email</label><input id="email" type="email">' },
    { title: 'Review and pay', lead: 'You pay today and can cancel at any time.',
      body: '<p>Team plan, $29 a month.</p>' },
  ];
  var DEFAULTS = { nodes: 'replace', title: 'direct', footer: 'card', tag: false, dialog: null };
  var shape = Object.assign({}, DEFAULTS);
  var step = 0;
  var built = null; // the markup a 'keep' redraw reuses, and the structure it was built for

  function last() { return step === STEPS.length - 1; }

  function titleMarkup(s) {
    return '<h2>' + s.title + '</h2><p class="lead">' + s.lead + '</p>';
  }

  function actionsMarkup() {
    return '<div class="actions"><button type="button" class="back"' + (step === 0 ? ' disabled' : '') + '>Back</button>' +
      '<button type="button" class="next">' + (last() ? 'Pay now' : 'Continue') + '</button></div>';
  }

  function cardMarkup(s) {
    var head = shape.title === 'direct' ? titleMarkup(s) : shape.title === 'wrapped' ? '<div class="head">' + titleMarkup(s) + '</div>' : '';
    var tag = shape.tag ? ' data-gm-screen="' + s.title + '"' : '';
    var dialog = shape.dialog === 'last' && last() ? ' role="dialog" aria-label="' + s.title + '"' : '';
    return '<section class="card"' + tag + dialog + '>' + head + '<div class="fields">' + s.body + '</div>' +
      (shape.footer === 'card' ? actionsMarkup() : '') + '</section>';
  }

  // The title block of the 'page' habit: a direct child of <body>, above everything else.
  function pageTitle(s) {
    var bar = document.querySelector('body > .titlebar');
    if (shape.title !== 'page') {
      if (bar) bar.remove();
      return;
    }
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'titlebar';
      document.body.prepend(bar);
    }
    bar.innerHTML = titleMarkup(s);
  }

  // Draw the step as new markup.
  function replace(s) {
    document.getElementById('stage').innerHTML = cardMarkup(s);
    document.getElementById('shared').innerHTML = shape.footer === 'app' ? actionsMarkup() : '';
  }

  // Keep every node and change only its words, as React does when the markup's
  // shape is the same from one step to the next. A step whose shape differs
  // (the dialog) is drawn afresh, as React would.
  function keep(s) {
    var structure = JSON.stringify(shape) + (shape.dialog === 'last' && last());
    if (!built || built.structure !== structure) {
      replace(s);
      built = { structure: structure };
      return;
    }
    document.querySelectorAll('h2').forEach(function (h) { h.textContent = s.title; });
    document.querySelectorAll('.lead').forEach(function (p) { p.textContent = s.lead; });
    document.querySelector('.fields').innerHTML = s.body;
    var back = document.querySelector('.back');
    back.disabled = step === 0;
    document.querySelector('.next').textContent = last() ? 'Pay now' : 'Continue';
    var card = document.querySelector('.card');
    if (shape.tag) card.setAttribute('data-gm-screen', s.title);
  }

  function render() {
    var s = STEPS[step];
    pageTitle(s);
    if (shape.nodes === 'keep') keep(s);
    else replace(s);
  }

  window.redrawShape = function (options) {
    shape = Object.assign({}, DEFAULTS, options || {});
    step = 0;
    built = null;
    document.getElementById('stage').innerHTML = '';
    document.getElementById('shared').innerHTML = '';
    render();
  };

  document.addEventListener('click', function (e) {
    if (e.target.closest('button.next') && !last()) {
      step += 1;
      render();
    } else if (e.target.closest('button.back') && step > 0) {
      step -= 1;
      render();
    }
  });

  render();
</script>

</body>
</html>
