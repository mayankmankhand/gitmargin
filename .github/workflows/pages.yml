# The public demo on GitHub Pages: a Pokémon prototype with the overlay attached.
#
# Built from source on every push that can change it, so the page always runs the
# overlay in this tree: npm run build bundles dist/gitmargin.js, then attach writes
# demo/next-best-pokemon.gitmargin.html, which is published as the site's index.html.
# The attached copy is never committed (*.gitmargin.html is ignored). It is attached
# without --service, so the page talks to nothing and each visitor's comments stay
# in their own browser.
#
# Pages must be set to "GitHub Actions" once:
#   gh api -X POST repos/mayankmankhand/gitmargin/pages -f build_type=workflow
name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/overlay/**'
      - 'src/cli/**'
      - 'bin/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach the overlay to the demo
        run: |
          node bin/gitmargin.js attach demo/next-best-pokemon.html
          mkdir -p _site
          cp demo/next-best-pokemon.gitmargin.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
